<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Server Management</title>

<!--
  Tailwind v4 browser build: compiles in the page, including classes the
  views inject after load. No build step, matching the rest of the project.
  See prototypes/README.md before shipping this to production.
-->
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  @theme {
    --color-brand-50:  #f1efff;
    --color-brand-100: #e6e2ff;
    --color-brand-200: #d3ccff;
    --color-brand-300: #b9aefb;
    --color-brand-500: #6d5be7;
    --color-brand-600: #5b48d8;
    --color-brand-700: #4b3ac0;
    --color-canvas:    #eceef4;
    --color-panel:     #f7f8fc;
  }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  body { font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>

<!-- overflow-hidden guarantees only the sidebar and main pane scroll, never
     the document, so the shell can never be pushed off-screen. -->
<body class="h-full overflow-hidden bg-canvas text-slate-900 antialiased">

<div id="app" class="h-full p-2 sm:p-3 lg:p-5">
  <div class="flex h-full w-full overflow-hidden rounded-2xl bg-white shadow-[0_20px_60px_-20px_rgba(15,23,42,0.25)] lg:rounded-[28px]">

    <!-- ═══ SIDEBAR ═══ -->
    <aside class="no-scrollbar flex w-60 shrink-0 flex-col overflow-y-auto border-r border-slate-100 px-5 py-6">
      <a href="#dashboard" class="flex items-center gap-2.5 px-1">
        <span class="grid h-9 w-9 place-items-center rounded-xl bg-brand-500 text-white shadow-lg shadow-brand-500/30">
          <svg class="h-4.5 w-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <rect x="3" y="4" width="18" height="6" rx="2"></rect><rect x="3" y="14" width="18" height="6" rx="2"></rect>
            <path d="M7 7h.01M7 17h.01"></path>
          </svg>
        </span>
        <span class="text-[17px] font-bold tracking-tight">Servers</span>
      </a>

      <nav class="mt-8">
        <p class="px-3 pb-2 text-[10px] font-bold tracking-[0.14em] text-slate-400">OVERVIEW</p>
        <div class="space-y-1" data-nav-group="overview"></div>
      </nav>

      <nav class="mt-7">
        <p class="px-3 pb-2 text-[10px] font-bold tracking-[0.14em] text-slate-400">ACTIVITY</p>
        <div class="space-y-1" data-nav-group="activity"></div>
      </nav>

      <div class="mt-7">
        <p class="px-3 pb-2 text-[10px] font-bold tracking-[0.14em] text-slate-400">ACCOUNTS</p>
        <div class="space-y-0.5" id="nav-accounts"></div>
      </div>

      <div class="mt-auto space-y-1 pt-7">
        <p class="px-3 pb-2 text-[10px] font-bold tracking-[0.14em] text-slate-400">SETTINGS</p>
        <div class="space-y-1" data-nav-group="settings"></div>
      </div>
    </aside>

    <!-- ═══ MAIN ═══ -->
    <div class="flex min-w-0 flex-1 flex-col bg-panel">
      <header class="flex shrink-0 items-center gap-3 px-4 py-4 sm:gap-5 sm:px-6 lg:px-7 lg:py-5">
        <label class="flex h-11 flex-1 items-center gap-3 rounded-full bg-white px-5 shadow-sm ring-1 ring-slate-100">
          <svg class="h-4 w-4 shrink-0 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5L21 21"></path>
          </svg>
          <input id="search-input" type="text" placeholder="Search environment, person, ticket…"
                 class="w-full bg-transparent text-sm text-slate-700 placeholder:text-slate-400 focus:outline-none" />
        </label>

        <div id="sync-indicator" class="hidden max-w-[160px] shrink-0 items-center gap-2 text-xs font-medium text-slate-500 md:flex"></div>

        <button data-action="sync-jira" title="Sync Jira now"
                class="grid h-11 w-11 shrink-0 place-items-center rounded-full bg-white text-slate-500 shadow-sm ring-1 ring-slate-100 transition hover:text-brand-600">
          <svg class="h-4.5 w-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M20 11a8 8 0 10-2.3 5.6"></path><path d="M20 4.5V11h-6.5"></path>
          </svg>
        </button>

        <div class="h-8 w-px shrink-0 bg-slate-200"></div>

        <a href="#settings" class="flex shrink-0 items-center gap-3">
          <span class="grid h-10 w-10 place-items-center rounded-full bg-brand-100 text-sm font-bold text-brand-600">RM</span>
          <span class="hidden text-sm font-semibold lg:inline">Rome M.</span>
        </a>
      </header>

      <main id="view" class="no-scrollbar min-h-0 flex-1 overflow-y-auto"></main>
    </div>
  </div>
</div>

<div id="modal-host"></div>

<!-- Data layer: seed + migrations, persistence, and the single source of
     truth. Shared with server.js via data.js's module.exports. -->
<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/state.js"></script>
<script src="js/format.js"></script>

<!-- UI layer: tokens → view-models → primitives → router → pages → chrome. -->
<script src="js/ui/tokens.js"></script>
<script src="js/ui/model.js"></script>
<script src="js/ui/html.js"></script>
<script src="js/ui/router.js"></script>
<script src="js/ui/actions.js"></script>
<script src="js/ui/modals.js"></script>
<script src="js/ui/shell.js"></script>
<script src="js/ui/env-detail.js"></script>
<script src="js/ui/page-dashboard.js"></script>
<script src="js/ui/page-environments.js"></script>
<script src="js/ui/page-health.js"></script>
<script src="js/ui/page-in-use.js"></script>
<script src="js/ui/page-tickets.js"></script>
<script src="js/ui/page-not-tracked.js"></script>
<script src="js/ui/page-settings.js"></script>

<script src="js/app.js"></script>
</body>
</html>
