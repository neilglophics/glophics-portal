<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Server Management — Tailwind concept</title>

<!--
  Design prototype. Every page renders from the DATA block at the bottom of
  this file — nothing here talks to State, /api/* or Jira. See
  prototypes/README.md for the Tailwind CDN-vs-build-step trade.
-->
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  @theme {
    --color-brand-50:  #f1efff;
    --color-brand-100: #e6e2ff;
    --color-brand-200: #d3ccff;
    --color-brand-500: #6d5be7;
    --color-brand-600: #5b48d8;
    --color-brand-700: #4b3ac0;
    --color-canvas:    #eceef4;
    --color-panel:     #f7f8fc;
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  body { font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>

<body class="h-full bg-canvas text-slate-900 antialiased">
<div class="h-full p-5">
  <div class="mx-auto flex h-full max-w-[1600px] overflow-hidden rounded-[28px] bg-white shadow-[0_20px_60px_-20px_rgba(15,23,42,0.25)]">

    <!-- ══ SIDEBAR ══ -->
    <aside class="flex w-60 shrink-0 flex-col overflow-y-auto border-r border-slate-100 px-5 py-6 no-scrollbar">
      <div class="flex items-center gap-2.5 px-1">
        <div class="grid h-9 w-9 place-items-center rounded-xl bg-brand-500 text-white shadow-lg shadow-brand-500/30">
          <svg class="h-4.5 w-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <rect x="3" y="4" width="18" height="6" rx="2"></rect><rect x="3" y="14" width="18" height="6" rx="2"></rect>
            <path d="M7 7h.01M7 17h.01"></path>
          </svg>
        </div>
        <span class="text-[17px] font-bold tracking-tight">Servers</span>
      </div>

      <nav class="mt-8" id="nav-overview">
        <p class="px-3 pb-2 text-[10px] font-bold tracking-[0.14em] text-slate-400">OVERVIEW</p>
        <div class="space-y-1" data-nav-group="overview"></div>
      </nav>

      <nav class="mt-7">
        <p class="px-3 pb-2 text-[10px] font-bold tracking-[0.14em] text-slate-400">ACTIVITY</p>
        <div class="space-y-1" data-nav-group="activity"></div>
      </nav>

      <div class="mt-7">
        <p class="px-3 pb-2 text-[10px] font-bold tracking-[0.14em] text-slate-400">ACCOUNTS</p>
        <div class="space-y-0.5" id="nav-accounts"></div>
      </div>

      <div class="mt-auto space-y-1 pt-7">
        <p class="px-3 pb-2 text-[10px] font-bold tracking-[0.14em] text-slate-400">SETTINGS</p>
        <div class="space-y-1" data-nav-group="settings"></div>
        <a href="#" class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-rose-500 transition hover:bg-rose-50">
          <svg class="h-4.5 w-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 17l5-5-5-5M20 12H9M12 20H6a2 2 0 01-2-2V6a2 2 0 012-2h6"/></svg>
          Logout
        </a>
      </div>
    </aside>

    <!-- ══ MAIN ══ -->
    <div class="flex min-w-0 flex-1 flex-col bg-panel">
      <header class="flex shrink-0 items-center gap-5 px-7 py-5">
        <label class="flex h-11 flex-1 items-center gap-3 rounded-full bg-white px-5 shadow-sm ring-1 ring-slate-100">
          <svg class="h-4 w-4 shrink-0 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
          <input type="text" placeholder="Search environment, person, ticket…" class="w-full bg-transparent text-sm text-slate-700 placeholder:text-slate-400 focus:outline-none" />
        </label>
        <button class="grid h-11 w-11 shrink-0 place-items-center rounded-full bg-white text-slate-500 shadow-sm ring-1 ring-slate-100 transition hover:text-brand-600" title="Refresh">
          <svg class="h-4.5 w-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 10-2.3 5.6"/><path d="M20 4.5V11h-6.5"/></svg>
        </button>
        <button class="relative grid h-11 w-11 shrink-0 place-items-center rounded-full bg-white text-slate-500 shadow-sm ring-1 ring-slate-100 transition hover:text-brand-600">
          <svg class="h-4.5 w-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8.5a6 6 0 10-12 0c0 5-2 6.5-2 6.5h16s-2-1.5-2-6.5z"/><path d="M10.5 19a2 2 0 003 0"/></svg>
          <span class="absolute right-3 top-3 h-2 w-2 rounded-full bg-rose-500 ring-2 ring-white"></span>
        </button>
        <div class="h-8 w-px shrink-0 bg-slate-200"></div>
        <div class="flex shrink-0 items-center gap-3">
          <div class="grid h-10 w-10 place-items-center rounded-full bg-brand-100 text-sm font-bold text-brand-600">RM</div>
          <span class="text-sm font-semibold">Rome M.</span>
        </div>
      </header>

      <main id="view" class="no-scrollbar min-h-0 flex-1 overflow-y-auto"></main>
    </div>
  </div>
</div>

<script>
/* ─────────────────────────  DATA  ─────────────────────────
   Stand-in for State.getServers() / getServerTickets() / getSkippedTickets().
   Shapes mirror the real app so the views can be ported field-for-field. */

const PEOPLE = {
  sem:     { name: '[BE]_Sem',     init: 'SM', tone: 'violet'  },
  jerome:  { name: '[QA]_Jerome',  init: 'JR', tone: 'emerald' },
  neil:    { name: '[FE]_Neil',    init: 'NL', tone: 'blue'    },
  joshua:  { name: '[BE]_Joshua',  init: 'JS', tone: 'emerald' },
  carl:    { name: '[QA]_Carl',    init: 'CL', tone: 'amber'   },
  aby:     { name: '[BE]_Aby',     init: 'AB', tone: 'violet'  },
  michael: { name: '[QA]_Michael', init: 'MC', tone: 'blue'    },
  grace:   { name: '[QA]_Grace',   init: 'GR', tone: 'emerald' },
  mat:     { name: '[BE]_Mat',     init: 'MT', tone: 'blue'    },
  chaimel: { name: '[FE]_Chaimel', init: 'CH', tone: 'amber'   }
};

const CLAIMS = [
  { id:'GLOP-1271', acct:'Musticker', env:'hotfix-1', repos:['storefront'],                    people:['neil','grace'],                  status:'QA TESTING (DEV)', summary:'Checkout banner copy',  since:'Today 10:22', mins:288,  pct:72 },
  { id:'GLOP-1284', acct:'Musticker', env:'hotfix-1', repos:['backend','admin'],               people:['sem','jerome'],                  status:'QA TESTING (STG)', summary:'Order webhook retry',   since:'Today 09:40', mins:210,  pct:78 },
  { id:'GLOP-1402', acct:'Musticker', env:'hotfix-2', repos:['backend'],                       people:['aby'],                           status:'QA TESTING (DEV)', summary:'Payment retry fix',     since:'Today 09:05', mins:95,   pct:88 },
  { id:'GLOP-1417', acct:'Musticker', env:'hotfix-3', repos:['backend','admin'],               people:['aby','sem','chaimel','carl'],    status:'QA TESTING (DEV)', summary:'Fulfilment rework',     since:'Aug 10',      mins:1440, pct:34 },
  { id:'GLOP-1433', acct:'Musticker', env:'static-3', repos:['storefront','backend'],          people:['jerome','mat'],                  status:'QA TESTING (STG)', summary:'Data migration soak',   since:'Sat 10:43',   mins:2889, pct:20 },
  { id:'GLOP-1388', acct:'Northgate', env:'hotfix-1', repos:['storefront'],                    people:['neil','grace'],                  status:'QA TESTING (DEV)', summary:'PDP layout QA',         since:'Today 08:40', mins:40,   pct:94 },
  { id:'GLOP-1390', acct:'Northgate', env:'hotfix-1', repos:['backend','admin'],               people:['joshua'],                        status:'QA TESTING (STG)', summary:'Stock sync',            since:'Today 08:55', mins:320,  pct:61 },
  { id:'GLOP-1290', acct:'Northgate', env:'static-2', repos:['backend'],                       people:['joshua'],                        status:'QA TESTING (DEV)', summary:'Search reindex',        since:'Fri 14:10',   mins:1500, pct:46 },
  { id:'GLOP-1451', acct:'Verilux',   env:'hotfix-3', repos:['storefront','backend','admin'],  people:['michael','aby'],                 status:'QA TESTING (STG)', summary:'Tax rules smoke test',  since:'Today 11:02', mins:430,  pct:52 },
  { id:'GLOP-1449', acct:'Verilux',   env:'static-1', repos:['admin'],                         people:['sem'],                           status:'QA TESTING (DEV)', summary:'Bulk import check',     since:'Today 07:55', mins:210,  pct:66 }
];

const SKIPPED = [
  { id:'GLOP-1567', status:'QA TESTING (DEV)', acct:'AllStickerPrinting', branch:'AS_hotfix-2', reason:'No account named "AllStickerPrinting" is configured.', fix:'account' },
  { id:'GLOP-1532', status:'QA TESTING (STG)', acct:'OzStickerPrinting',  branch:'OZ_static-1', reason:'No account named "OzStickerPrinting" is configured.',  fix:'account' },
  { id:'GLOP-1554', status:'QA TESTING (DEV)', acct:'StickerJapan',       branch:'SJ_hotfix-1', reason:'No account named "StickerJapan" is configured.',       fix:'account' },
  { id:'GLOP-1458', status:'QA TESTING (DEV)', acct:'Musticker',          branch:'MS_hotfix-2', reason:'Repository field is empty.',                           fix:'ticket'  },
  { id:'GLOP-1462', status:'QA TESTING (STG)', acct:'Musticker',          branch:'MS_hotfix-9', reason:'No environment named "MS_hotfix-9" under Musticker.',  fix:'env'     }
];

const ACCOUNTS = [
  { name:'Musticker', domain:'musticker.com', envs:['hotfix-1','hotfix-2','hotfix-3','static-1','static-2','static-3'] },
  { name:'Northgate', domain:'northgate.com', envs:['hotfix-1','hotfix-2','static-1','static-2'] },
  { name:'Verilux',   domain:'verilux.com',   envs:['hotfix-1','hotfix-2','hotfix-3','static-1'] }
];

const REPOS = ['storefront','backend','admin'];
const SHORT = { storefront:'SF', backend:'API', admin:'ADM' };
const OFFLINE = { 'Musticker/static-3':['backend'], 'Verilux/static-1':['admin'] };
const UNCONFIGURED = { 'Verilux/hotfix-2':['admin'] };
const LATENCY = { fast:'112 ms', ok:'240 ms', slow:'910 ms' };

/* ───────────────────  DERIVED (mirrors State.*)  ─────────────────── */

function repoUrl(acct, env, repo) {
  const a = ACCOUNTS.find(x => x.name === acct);
  const suffix = repo === 'backend' ? '-api' : repo === 'admin' ? '-admin' : '';
  return 'https://' + env + suffix + '.' + a.domain;
}
function claimsFor(acct, env)        { return CLAIMS.filter(c => c.acct === acct && c.env === env); }
function claimsForRepo(acct, env, r) { return claimsFor(acct, env).filter(c => c.repos.includes(r)); }
function offlineFor(acct, env)       { return OFFLINE[acct + '/' + env] || []; }
function unconfFor(acct, env)        { return UNCONFIGURED[acct + '/' + env] || []; }

function repoHealth(acct, env, repo) {
  if (unconfFor(acct, env).includes(repo)) return 'unconfigured';
  if (offlineFor(acct, env).includes(repo)) return 'offline';
  return 'online';
}
function envState(acct, env) {
  if (offlineFor(acct, env).length) return 'issue';
  const held = new Set(claimsFor(acct, env).flatMap(c => c.repos));
  if (held.size === 0) return 'free';
  return REPOS.every(r => held.has(r)) ? 'inuse' : 'partial';
}
function allEnvs() {
  return ACCOUNTS.flatMap(a => a.envs.map(e => ({
    acct: a.name, env: e, state: envState(a.name, e), claims: claimsFor(a.name, e)
  })));
}
function fmtMins(m) {
  const d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
  if (d > 0) return d + 'd ' + h + 'h';
  if (h > 0) return h + 'h ' + mm + 'm';
  return mm + 'm';
}
function peopleOf(c) { return c.people.map(k => PEOPLE[k]); }

/* ───────────────────────  UI TOKENS  ─────────────────────── */

const STATE = {
  free:    { label:'Free',        chip:'bg-emerald-50 text-emerald-700', dot:'bg-emerald-500', bar:'bg-emerald-500' },
  partial: { label:'Partly free', chip:'bg-brand-50 text-brand-600',     dot:'bg-brand-500',   bar:'bg-brand-500'   },
  inuse:   { label:'In use',      chip:'bg-amber-50 text-amber-700',     dot:'bg-amber-500',   bar:'bg-amber-500'   },
  issue:   { label:'Server down', chip:'bg-rose-50 text-rose-700',       dot:'bg-rose-500',    bar:'bg-rose-500'    }
};
const HEALTH = {
  online:       { label:'Online',         chip:'bg-emerald-50 text-emerald-700', dot:'bg-emerald-500' },
  offline:      { label:'Offline',        chip:'bg-rose-50 text-rose-700',       dot:'bg-rose-500'    },
  unconfigured: { label:'Not configured', chip:'bg-slate-100 text-slate-500',    dot:'bg-slate-300'   }
};
const JIRA_CHIP = {
  'QA TESTING (DEV)': 'bg-blue-50 text-blue-700',
  'QA TESTING (STG)': 'bg-violet-50 text-violet-700'
};
const TONE = {
  violet:'bg-violet-100 text-violet-700', emerald:'bg-emerald-100 text-emerald-700',
  blue:'bg-blue-100 text-blue-700',       amber:'bg-amber-100 text-amber-700'
};

/* ───────────────────────  SNIPPETS  ─────────────────────── */

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const chip = (cls, text) =>
  `<span class="inline-block rounded-md ${cls} px-2 py-1 text-[10px] font-bold tracking-wide whitespace-nowrap">${esc(text)}</span>`;

const dotChip = (t) =>
  `<span class="inline-flex items-center gap-1.5 rounded-full ${t.chip} px-2.5 py-1 text-[11px] font-semibold whitespace-nowrap">
     <span class="h-1.5 w-1.5 rounded-full ${t.dot}"></span>${t.label}</span>`;

const avatar = (p, size='h-8 w-8') =>
  `<span class="grid ${size} shrink-0 place-items-center rounded-full ${TONE[p.tone]} text-[10px] font-bold ring-2 ring-white">${p.init}</span>`;

const avatarStack = (list, max=3) => {
  const shown = list.slice(0, max);
  const rest  = list.length - shown.length;
  return `<div class="flex items-center">
    <div class="flex -space-x-2">${shown.map(p => avatar(p)).join('')}</div>
    ${rest > 0 ? `<span class="ml-2.5 text-[11px] font-semibold text-slate-400">+${rest}</span>` : ''}
  </div>`;
};

const repoStrip = (acct, env) => `<div class="flex gap-1">` + REPOS.map(r => {
  const h = repoHealth(acct, env, r);
  const held = claimsForRepo(acct, env, r).length > 0;
  const cls = h === 'offline' ? 'bg-rose-500/85 text-white'
            : h === 'unconfigured' ? 'bg-slate-200 text-slate-500'
            : held ? 'bg-amber-500/85 text-white' : 'bg-emerald-500/85 text-white';
  return `<span class="w-9 rounded-md ${cls} py-0.5 text-center text-[9px] font-bold" title="${r}: ${h}${held ? ', held' : ''}">${SHORT[r]}</span>`;
}).join('') + `</div>`;

const bar = (pct, cls) =>
  `<div class="h-1.5 w-full overflow-hidden rounded-full bg-slate-100"><div class="h-full rounded-full ${cls}" style="width:${pct}%"></div></div>`;

const iconBtn = (path, title) =>
  `<button title="${title}" class="grid h-8 w-8 place-items-center rounded-full text-slate-400 ring-1 ring-slate-200 transition hover:bg-brand-50 hover:text-brand-600 hover:ring-brand-200">
     <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">${path}</svg></button>`;

const ARROW = '<path d="M7 17L17 7M9 7h8v8"/>';
const RETRY = '<path d="M20 11a8 8 0 10-2.3 5.6"/><path d="M20 4.5V11h-6.5"/>';

const pageHead = (title, sub, actions='') => `
  <div class="flex items-end justify-between gap-6 pb-5">
    <div>
      <h1 class="text-[22px] font-bold tracking-tight">${esc(title)}</h1>
      <p class="mt-1 text-sm text-slate-400">${sub}</p>
    </div>
    <div class="flex shrink-0 gap-2">${actions}</div>
  </div>`;

const btnGhost = t => `<button class="rounded-full bg-white px-4 py-2.5 text-xs font-semibold text-slate-600 shadow-sm ring-1 ring-slate-200 transition hover:text-brand-600">${t}</button>`;
const btnDark  = t => `<button class="rounded-full bg-slate-900 px-4 py-2.5 text-xs font-semibold text-white transition hover:bg-slate-800">${t}</button>`;

const tableWrap = (head, body) => `
  <div class="overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-slate-100">
    <div class="overflow-x-auto">
      <table class="w-full min-w-[880px] text-left">
        <thead><tr class="border-b border-slate-100 text-[10px] font-bold tracking-[0.12em] text-slate-400">${head}</tr></thead>
        <tbody class="divide-y divide-slate-50">${body}</tbody>
      </table>
    </div>
  </div>`;

const th  = (t, extra='') => `<th class="px-5 py-3 font-bold ${extra}">${t}</th>`;
const td  = (c, extra='') => `<td class="px-5 py-3.5 ${extra}">${c}</td>`;
const tr  = c => `<tr class="transition hover:bg-slate-50/60">${c}</tr>`;

const statTile = (tone, label, value, sub, icon) => `
  <div class="flex items-center gap-3.5 rounded-2xl bg-white p-4 shadow-sm ring-1 ring-slate-100">
    <span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-${tone}-50 text-${tone}-600">
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">${icon}</svg>
    </span>
    <div class="min-w-0">
      <p class="truncate text-sm font-bold">${label}</p>
      <p class="text-xs text-slate-400">${sub}</p>
    </div>
    <span class="ml-auto shrink-0 text-2xl font-bold tracking-tight text-${tone}-600">${value}</span>
  </div>`;

const I_CHECK = '<path d="M4 12.5l5 5L20 6.5"/>';
const I_CLOCK = '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>';
const I_ALERT = '<path d="M12 8v5M12 16.5v.01"/><circle cx="12" cy="12" r="8.5"/>';
const I_PLUG  = '<path d="M9 3v6M15 3v6M6 9h12v3a6 6 0 01-12 0z"/><path d="M12 18v3"/>';

/* ───────────────────────  VIEWS  ─────────────────────── */

const views = {};

views.dashboard = () => {
  const envs = allEnvs();
  const free = envs.filter(e => e.state === 'free').length;
  const held = envs.filter(e => e.state !== 'free').length;
  const down = envs.filter(e => e.state === 'issue').length;
  const soon = CLAIMS.filter(c => c.mins < 120).length;
  const cards = envs.filter(e => e.state !== 'free').slice(0, 3);

  return `
  <div class="px-7 pb-8">
    <section class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-brand-500 to-brand-700 px-8 py-7 text-white">
      <svg class="pointer-events-none absolute -right-6 top-1/2 h-56 w-56 -translate-y-1/2 text-white/15" viewBox="0 0 100 100" fill="currentColor">
        <path d="M50 4c2 26 18 42 44 46-26 4-42 20-46 46-4-26-20-42-46-46 26-4 42-20 48-46z"/>
      </svg>
      <p class="text-[11px] font-bold tracking-[0.16em] text-white/70">ENVIRONMENT POOL</p>
      <h1 class="mt-2 max-w-lg text-[27px] font-bold leading-tight tracking-tight">${free} environments are free<br />and ready to book</h1>
      <p class="mt-2 max-w-md text-sm text-white/75">Claim one before your ticket reaches QA testing.</p>
      <button class="mt-5 inline-flex items-center gap-2.5 rounded-full bg-slate-900 py-2.5 pl-5 pr-2.5 text-sm font-semibold transition hover:bg-slate-800">
        Assign environment
        <span class="grid h-6 w-6 place-items-center rounded-full bg-white/15">
          <svg class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>
        </span>
      </button>
    </section>

    <section class="mt-5 grid grid-cols-4 gap-4">
      ${statTile('emerald','Available now', free, 'of ' + envs.length + ' environments', I_CHECK)}
      ${statTile('amber','In use', held, CLAIMS.length + ' active claims', I_CLOCK)}
      ${statTile('rose','Needs attention', down, 'unreachable servers', I_ALERT)}
      ${statTile('brand','Freeing up soon', soon, 'within 2 hours', I_CLOCK)}
    </section>

    <section class="mt-7">
      <div class="flex items-center justify-between">
        <h2 class="text-[17px] font-bold tracking-tight">Held right now</h2>
        <a href="#in-use" class="text-xs font-semibold text-brand-600 hover:underline">See all</a>
      </div>
      <div class="mt-4 grid grid-cols-3 gap-4">
        ${cards.map(e => {
          const t = STATE[e.state];
          const soonest = e.claims.length ? e.claims.reduce((a,b) => a.mins < b.mins ? a : b) : null;
          const tone = e.state === 'issue' ? 'rose' : e.state === 'partial' ? 'brand' : 'amber';
          return `
          <article class="overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-slate-100">
            <div class="flex h-24 flex-col justify-between bg-gradient-to-br from-${tone}-100 to-${tone}-50 p-3">
              <div class="flex items-start justify-between">
                <span class="rounded-full bg-white/70 px-2.5 py-1 text-[10px] font-bold text-${tone}-700 backdrop-blur">${t.label}</span>
              </div>
              ${repoStrip(e.acct, e.env)}
            </div>
            <div class="p-4">
              <span class="inline-block rounded-md bg-slate-100 px-2 py-0.5 text-[10px] font-bold tracking-wide text-slate-500">${e.acct.toUpperCase()}</span>
              <h3 class="mt-2.5 text-sm font-bold">${e.env}</h3>
              <div class="mt-3">${bar(soonest ? soonest.pct : 0, t.bar)}</div>
              <p class="mt-1.5 text-[11px] ${soonest && soonest.mins < 120 ? 'font-medium text-amber-600' : 'text-slate-400'}">

views.health = () => {
  const rows = [];
  ACCOUNTS.forEach(a => a.envs.forEach(e => REPOS.forEach(r => {
    const h = repoHealth(a.name, e, r);
    rows.push({
      acct:a.name, env:e, repo:r, health:h,
      url: h === 'unconfigured' ? null : repoUrl(a.name, e, r),
      latency: h === 'online' ? (e.startsWith('static') ? LATENCY.ok : LATENCY.fast) : null,
      checked: h === 'unconfigured' ? '—' : '18s ago'
    });
  })));
  const RANK = { offline: 0, unconfigured: 1, online: 2 };
  rows.sort((a, b) => RANK[a.health] - RANK[b.health]
    || a.acct.localeCompare(b.acct) || a.env.localeCompare(b.env)
    || REPOS.indexOf(a.repo) - REPOS.indexOf(b.repo));

  const online = rows.filter(r => r.health === 'online').length;
  const offline = rows.filter(r => r.health === 'offline').length;
  const unconf = rows.filter(r => r.health === 'unconfigured').length;
  const bad = rows.filter(r => r.health !== 'online');

  return `
  <div class="px-7 pb-8">
    ${pageHead('Server health', 'Reachability of all ' + rows.length + ' repositories, checked every minute · problems first',
       btnGhost('Recheck all'))}

    <section class="grid grid-cols-3 gap-4 pb-5">
      ${statTile('emerald','Responding', online, 'of ' + rows.length + ' endpoints', I_CHECK)}
      ${statTile('rose','Unreachable', offline, 'needs attention', I_ALERT)}
      ${statTile('slate','No URL set', unconf, 'never checked', I_PLUG)}
    </section>

    ${offline ? `
    <div class="mb-5 flex items-start gap-3 rounded-2xl bg-rose-50 p-4 ring-1 ring-rose-100">
      <svg class="mt-0.5 h-5 w-5 shrink-0 text-rose-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">${I_ALERT}</svg>
      <div>
        <p class="text-sm font-bold text-rose-800">${offline} endpoint${offline>1?'s':''} not responding</p>
        <p class="mt-0.5 text-xs text-rose-700">
          ${bad.filter(r=>r.health==='offline').map(r => r.acct + ' ' + r.env + ' · ' + r.repo).join(' — ')}.
          Their environments show as <strong>Server down</strong> until a check succeeds.
        </p>
      </div>
    </div>` : ''}

    ${tableWrap(
      th('ENDPOINT') + th('ENVIRONMENT') + th('REPOSITORY') + th('STATE') + th('RESPONSE') + th('LAST CHECK') + th('',''),
      rows.map(r => {
        const h = HEALTH[r.health];
        return tr(
          td(r.url
            ? `<a href="${r.url}" target="_blank" rel="noopener" class="text-xs font-medium text-slate-600 hover:text-brand-600 hover:underline">${r.url.replace('https://','')}</a>`
            : `<span class="text-xs italic text-slate-300">no URL configured</span>`) +
          td(`<p class="text-sm font-semibold">${r.env}</p><p class="text-[11px] text-slate-400">${r.acct}</p>`) +
          td(`<span class="text-xs font-semibold capitalize text-slate-500">${r.repo}</span>`) +
          td(dotChip(h)) +
          td(r.latency
            ? `<span class="text-xs font-semibold text-slate-500">${r.latency}</span>`
            : `<span class="text-xs text-slate-300">—</span>`) +
          td(`<span class="text-xs text-slate-400">${r.checked}</span>`) +
          td(iconBtn(r.health === 'unconfigured' ? ARROW : RETRY, r.health === 'unconfigured' ? 'Set URL' : 'Recheck'), 'text-right')
        );
      }).join('')
    )}
  </div>`;
};

  { group:'overview', id:'environments', label:'Environments', icon:'<rect x="2.5" y="5" width="19" height="6" rx="2"/><rect x="2.5" y="14" width="19" height="6" rx="2"/>' },
  { group:'overview', id:'health',       label:'Health',       icon:'<path d="M3 12h4l2.5-6 4 12 2.5-6H21"/>', badge:() => Object.values(OFFLINE).flat().length, badgeTone:'rose' },
  { group:'activity', id:'in-use',       label:'In use',       icon:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>', badge:() => CLAIMS.reduce((n,c)=>n+c.repos.length,0) },
  { group:'activity', id:'tickets',      label:'Tickets',      icon:'<path d="M4 6h16M4 12h16M4 18h10"/>', badge:() => CLAIMS.length },
  { group:'activity', id:'not-tracked',  label:'Not tracked',  icon:'<path d="M12 8v5M12 16.5v.01"/><circle cx="12" cy="12" r="8.5"/>', badge:() => SKIPPED.length, badgeTone:'amber' },
  { group:'settings', id:'settings',     label:'Setting',      icon:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M21.5 12h-3M5.5 12h-3"/>' }
];

function renderNav(active) {
  ['overview','activity','settings'].forEach(g => {
    const host = document.querySelector(`[data-nav-group="${g}"]`);
    host.innerHTML = NAV.filter(n => n.group === g).map(n => {
      const on = n.id === active;
      const count = n.badge ? n.badge() : null;
      const tone = n.badgeTone === 'rose' ? 'bg-rose-100 text-rose-700'
                 : n.badgeTone === 'amber' ? 'bg-amber-100 text-amber-700'
                 : 'bg-slate-100 text-slate-500';
      return `<a href="#${n.id}" class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm transition ${
        on ? 'bg-brand-50 font-semibold text-brand-600' : 'font-medium text-slate-500 hover:bg-slate-50 hover:text-slate-900'}">
        <svg class="h-4.5 w-4.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">${n.icon}</svg>
        <span class="flex-1">${n.label}</span>
        ${count ? `<span class="rounded-full ${tone} px-2 py-0.5 text-[11px] font-bold">${count}</span>` : ''}
      </a>`;
    }).join('');
  });

  document.getElementById('nav-accounts').innerHTML = ACCOUNTS.map(a => {
    const envs = a.envs.map(e => envState(a.name, e));
    const free = envs.filter(s => s === 'free').length;
    const dot = envs.includes('issue') ? 'bg-rose-500' : free ? 'bg-emerald-500' : 'bg-amber-500';
    return `<a href="#environments" class="flex items-center gap-3 rounded-xl px-3 py-2 transition hover:bg-slate-50">
      <span class="h-2 w-2 shrink-0 rounded-full ${dot}"></span>
      <span class="flex-1 text-sm font-medium text-slate-700">${a.name}</span>
      <span class="text-[11px] font-semibold text-slate-400">${free}/${a.envs.length}</span>
    </a>`;
  }).join('');
}

function route() {
  const id = (location.hash || '#dashboard').slice(1);
  const view = views[id] ? id : 'dashboard';
  document.getElementById('view').innerHTML = views[view]();
  document.getElementById('view').scrollTop = 0;
  renderNav(view);
}

window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
